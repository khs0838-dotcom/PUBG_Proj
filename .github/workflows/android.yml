name: PUBG Android CI (verified offline maps)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Android project
        shell: bash
        run: |
          if [ -f settings.gradle ] && [ -f tools/prepare_offline_assets.py ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f PUBG_Mortar_AutoPhoto_V3/settings.gradle ]; then
            echo "PROJECT_DIR=PUBG_Mortar_AutoPhoto_V3" >> "$GITHUB_ENV"
          else
            echo "ERROR: Cannot find this project's settings.gradle + tools/"
            find . -maxdepth 3 \( -name 'settings.gradle' -o -name 'prepare_offline_assets.py' \) -print
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android API 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependencies
        run: python -m pip install -r "$PROJECT_DIR/tools/requirements.txt"

      - name: Prepare bundled official PUBG map images and optional historical height
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FETCH_LEGACY_HEIGHT: '1'
        run: python "$PROJECT_DIR/tools/prepare_offline_assets.py"

      - name: Validate source assets BEFORE building
        run: python "$PROJECT_DIR/tools/verify_assets.py" "$PROJECT_DIR/app/src/main/assets"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" --no-daemon --stacktrace :app:assembleDebug

      - name: Validate final APK contains maps and OpenCV
        run: python "$PROJECT_DIR/tools/verify_apk.py" "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload checked APK
        uses: actions/upload-artifact@v4
        with:
          name: PUBG-Mortar-Checked-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
