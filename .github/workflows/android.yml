
name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build PUBG Mortar APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # 1. 소스 체크아웃
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Java 17 설치
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Android SDK 설치
      # 제거된 tools 패키지 설치 방지
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 4. Android API 35 설치
      - name: Install Android 35 platform and build tools
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      # 5. Gradle 8.9 설치
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 6. 프로젝트 경로 확인
      - name: Find Android project
        shell: bash
        run: |
          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f PUBG_Mortar_Android/settings.gradle ] || [ -f PUBG_Mortar_Android/settings.gradle.kts ]; then
            echo "PROJECT_DIR=PUBG_Mortar_Android" >> "$GITHUB_ENV"
          else
            echo "ERROR: Android project not found"
            find . -maxdepth 3 -name 'settings.gradle*' -print
            exit 1
          fi

      # 7. APK 빌드
      - name: Build Debug APK
        run: gradle -p "$PROJECT_DIR" --no-daemon --stacktrace :app:assembleDebug

      # 8. APK 업로드
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PUBG-Mortar-Calculator-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
